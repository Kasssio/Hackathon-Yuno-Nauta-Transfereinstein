<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volta — Operador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Mismos tokens que index.html/dashboard — ver el comentario ahí. Acá solo
   se copia el subconjunto de clases que esta pantalla usa. */
:root {
  --bg:         #1a1e23;
  --surface:    #1f252b;
  --surface-2:  #242b32;
  --well:       #171b20;
  --borde:      rgba(255,255,255,.055);
  --borde-alto: rgba(255,255,255,.09);

  --ink:        #e9eef3;
  --ink-2:      #9dabb6;
  --ink-3:      #6c7985;

  --accent:     #2dd4bf;
  --good:       #34d399;
  --warn:       #fb923c;
  --bad:        #f87171;
  --bad-dim:    rgba(248,113,113,.13);

  --nm:        -5px -5px 13px rgba(255,255,255,.021),  6px 6px 16px rgba(0,0,0,.50);
  --nm-suave:  -3px -3px  8px rgba(255,255,255,.017),  4px 4px 11px rgba(0,0,0,.40);
  --nm-hueco:  inset -2px -2px 6px rgba(255,255,255,.022), inset 3px 3px 8px rgba(0,0,0,.46);

  --r:    10px;
  --r-lg: 20px;
}

* { box-sizing: border-box; }

body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--ink);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px; line-height: 1.5; letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.header { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 62px; flex: none; border-bottom: 1px solid var(--borde); }
.logo {
  width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(145deg, #35e6d0, #1aa898);
  color: #06231f; font-weight: 900; font-size: 17px; letter-spacing: -.04em;
  box-shadow: var(--nm-suave), inset 0 1px 0 rgba(255,255,255,.28);
}
.marca__n { font-size: 17px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.marca__s { font-size: 11.5px; color: var(--ink-3); line-height: 1.25; }

.cuerpo { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 40px 18px; }
.panel {
  width: 100%; max-width: 420px;
  background: var(--surface); border: 1px solid var(--borde);
  border-radius: var(--r-lg); box-shadow: var(--nm);
  padding: 24px 20px;
}

.llamada { display: flex; flex-direction: column; align-items: center; gap: 16px; }

.orbe {
  width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center;
  background: var(--well); box-shadow: var(--nm-hueco);
  color: var(--ink-3); position: relative; transition: color .25s;
}
.orbe svg { width: 34px; height: 34px; }
.orbe::after {
  content: ""; position: absolute; inset: -6px; border-radius: 50%;
  border: 2px solid transparent; transition: border-color .25s;
}
.orbe--live { color: var(--good); }
.orbe--live::after { border-color: rgba(52,211,153,.35); animation: latido 1.6s ease-in-out infinite; }
.orbe--esperando { color: var(--warn); }
.orbe--esperando::after { border-color: rgba(251,146,60,.4); animation: latido 1.1s ease-in-out infinite; }
@keyframes latido { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.08); opacity: .4 } }

.estado-pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 100px;
  background: var(--well); box-shadow: var(--nm-hueco); font-size: 12.5px; font-weight: 700;
  color: var(--ink-2); text-align: center; max-width: 100%;
}
.estado-pill__p { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

.controles { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

.btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: -.012em;
  padding: 11px 14px; border-radius: var(--r); cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--borde); color: var(--ink);
  box-shadow: var(--nm-suave); transition: box-shadow .18s, background .18s, transform .12s;
}
.btn:hover { background: #29323a; border-color: var(--borde-alto); }
.btn:active { box-shadow: var(--nm-hueco); transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn:disabled:hover { background: var(--surface-2); }

.btn--primario {
  background: linear-gradient(145deg, #35e6d0, #16a396); color: #06231f;
  border-color: transparent; font-weight: 700;
  box-shadow: var(--nm-suave), inset 0 1px 0 rgba(255,255,255,.25);
}
.btn--primario:hover { filter: brightness(1.07); background: linear-gradient(145deg, #35e6d0, #16a396); }

.btn--peligro {
  background: linear-gradient(145deg, #f4635c, #c73833); color: #fff; border-color: transparent;
  box-shadow: var(--nm-suave), 0 0 14px rgba(248,113,113,.22);
}
.btn--peligro:hover { filter: brightness(1.08); background: linear-gradient(145deg, #f4635c, #c73833); color: #fff; }

.aviso {
  display: flex; gap: 10px; padding: 12px 13px; border-radius: var(--r); margin-top: 6px;
  background: var(--bad-dim); border: 1px solid rgba(248,113,113,.3);
  font-size: 11.5px; color: var(--ink-2); line-height: 1.5;
}
.aviso svg { flex: none; color: var(--bad); margin-top: 1px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">V</div>
  <div>
    <div class="marca__n">Volta</div>
    <div class="marca__s">Operador — puente de audio en vivo</div>
  </div>
</div>

<div class="cuerpo">
  <div class="panel">
    <div class="llamada">
      <div class="orbe" id="orbe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      </div>
      <div class="estado-pill" id="estado-pill"><span class="estado-pill__p"></span><span id="status">sin conectar</span></div>

      <div class="controles">
        <button class="btn btn--primario" id="conectar">Conectar micrófono</button>
        <button class="btn btn--peligro" id="volver" disabled>Devolver a Volta</button>
      </div>

      <div class="aviso">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <div>Esto conecta tu micrófono directo con el transportista, en paralelo a la llamada que sigue teniendo con Volta (que se queda callada mientras estás vos). "Devolver a Volta" corta este puente y Volta retoma la conversación.</div>
      </div>
    </div>
  </div>
</div>

<script src="operador.js"></script>
</body>
</html>
